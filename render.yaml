services:
  - type: web
    name: cblaero
    runtime: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    nodeVersion: "24"
    plan: starter
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      # All values already set in Render dashboard — listed here for reference only
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CBL_SUPABASE_URL
        sync: false
      - key: CBL_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: CBL_APP_URL
        sync: false
      - key: CBL_APP_TENANT_ID
        sync: false
      - key: CBL_SESSION_SECRET
        sync: false
      - key: CBL_JOBS_SECRET
        sync: false
      - key: CBL_SSO_CLIENT_ID
        sync: false
      - key: CBL_SSO_CLIENT_SECRET
        sync: false
      - key: CBL_SSO_ISSUER
        sync: false
      - key: CBL_SSO_TOKEN_ISSUER
        sync: false
      - key: CBL_SSO_REDIRECT_URI
        sync: false
      - key: CBL_SSO_ALLOWED_EMAIL_DOMAIN
        sync: false
      - key: CBL_SSO_ALLOWED_TENANT_ID
        sync: false
      - key: CBL_DATA_REGION
        sync: false
      - key: CBL_BACKUP_REGION
        sync: false
      - key: CBL_LOG_REGION
        sync: false
      - key: CBL_APPROVED_US_REGIONS
        sync: false
      - key: CBL_SUPABASE_SCHEMA
        value: cblaero_app
      - key: CBL_SUBMISSION_INBOXES
        sync: false
      - key: CBL_VECTOR_AUDIT_ENABLED
        sync: false
      - key: CBL_VECTOR_AUDIT_TABLE
        sync: false
      - key: CBL_VECTOR_DIMENSIONS
        sync: false
      - key: CEIPAL_API_KEY
        sync: false
      - key: CEIPAL_ENDPOINT_KEY
        sync: false
      - key: CEIPAL_PASSWORD
        sync: false
      - key: CEIPAL_USERNAME
        sync: false
